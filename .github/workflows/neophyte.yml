# Builds Neophyte for Linux (AppImage) and Android (Neophyte Pocket APK)
# and publishes them as a release named for package.json's version.
# Started by hand from the Actions tab. The Mac build is made on a Mac and
# added to the same release (it can't be signed here).
#
# Android signing: with the repo secrets POCKET_KEYSTORE_BASE64 and
# POCKET_KEYSTORE_PASSWORD, every APK installs over the last one. Without
# them the APK is debug-signed, which won't install over a signed one.

name: Build Neophyte

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          retention-days: 1
          path: |
            dist/*.AppImage
            dist/latest-linux*.yml

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install and assemble web assets
        run: |
          npm install --ignore-scripts
          node scripts/pocket-www.js
          cd pocket
          npm install
          npx cap sync android
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.POCKET_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pocket.jks"
          else
            echo "::warning::No POCKET_KEYSTORE_BASE64 secret: the APK is debug-signed."
          fi
      - name: Build APK
        env:
          POCKET_VERSION_CODE: ${{ github.run_number }}
          POCKET_VERSION_NAME: neophyte-${{ github.run_number }}
          POCKET_KEYSTORE_FILE: ${{ runner.temp }}/pocket.jks
          POCKET_KEYSTORE_PASSWORD: ${{ secrets.POCKET_KEYSTORE_PASSWORD }}
        run: |
          cd pocket/android
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/neophyte-pocket.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          retention-days: 1
          path: ${{ runner.temp }}/neophyte-pocket.apk

  release:
    needs: [linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish the release (or add to it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Neophyte $tag" \
              --notes "NEO with the Parchment and E-Ink pages. See the README."
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" --clobber out/linux/* out/android/*
